replicaCount: 2

image:
  repository: osza/chaos-api
  tag: "v1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000  

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

probes:
  liveness:
    path: "/metrics"
  readiness:
    path: "/metrics"

metrics:
  enabled: true
  path: "/metrics"
  port: 8000
