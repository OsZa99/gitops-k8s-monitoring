apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-api-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/OsZa99/gitops-k8s-monitoring'
    targetRevision: main
    path: helm/chaos-api
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true     
      selfHeal: true 